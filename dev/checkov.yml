# Used by the pipeline (root copy: dev.workflow.yml, installed as
# .github/workflows/dev.yml) via `config_file: checkov.yml`.
# NOTE: checkov only auto-discovers a file named `.checkov.yaml` — the
# workflow must pass this file explicitly.
framework:
  - terraform

# Checks skipped for the DEV environment, each with its reason.
# Fix findings instead of skipping them wherever practical.
skip-check:
  - CKV_AWS_24 # SSH ingress open; restrict allowed_ssh_cidrs in dev.auto.tfvars when ready
  - CKV_AWS_88 # Public EC2 behind an EIP is the design (nginx is the entrypoint)
  - CKV_AWS_126 # Detailed monitoring costs extra; basic monitoring is fine for dev
  - CKV_AWS_130 # Single public subnet by design (no NAT gateway in dev)
  - CKV_AWS_144 # Cross-region replication doubles storage cost
  - CKV_AWS_145 # SSE-S3 (AES256) is used instead of a KMS CMK
  - CKV_AWS_189 # EBS encrypted with the AWS-managed key, not a CMK
  - CKV_AWS_260 # Port 80 open - nginx serves HTTP (add TLS termination later)
  - CKV_AWS_297 # EventBridge schedules use AWS-managed encryption
  - CKV_AWS_382 # Unrestricted egress needed: docker pulls, S3 backups, GitHub
  - CKV_AWS_18 # S3 access logging would need a second bucket
  - CKV2_AWS_11 # VPC flow logs cost extra; enable for prod
  - CKV2_AWS_38 # DNSSEC needs KMS + registrar DS records
  - CKV2_AWS_39 # Route53 query logging costs extra
  - CKV2_AWS_62 # Backup bucket has no event consumers

compact: true
quiet: false
