# trivy.yml — filesystem scan of the dev/ folder:
# vulnerabilities (package files, if any), IaC misconfig (Terraform), secrets.
scanners:
  - vuln
  - misconfig
  - secret

severity:
  - HIGH
  - CRITICAL

misconfiguration:
  scanners:
    - terraform

# Existing resources imported as-is (not the new design).
scan:
  skip-files:
    - "**/legacy.tf"
