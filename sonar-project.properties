sonar.projectName=Agrovesto Infrastructure
sonar.sources=bootstrap,environments,modules,scripts,ops
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/.terraform/**,**/*.tfvars*,**/.terraform.lock.hcl,**/tests/**,**/*.example
# Host URL/token/project key come from GitHub configuration, never from Git.
# Self-hosted SonarQube must support branch and PR analysis (Developer+ edition).
