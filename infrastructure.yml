name: Infrastructure

on:
  pull_request:
    branches: [dev, main]

  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.event.pull_request.number || github.ref_name }}
  # Never cancel an in-flight Terraform operation.
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:

  # ============================================================
  # UNIT TESTS - cached & parallel-ready
  # ============================================================

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit and workflow regression tests
        run: make unit

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 3
          if-no-files-found: error

  # ============================================================
  # CHECKOV - cost-optimized: pip cache, no redundant installs
  # ============================================================

  checkov:
    name: Checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Checkov
        run: python -m pip install checkov==3.2.471

      - name: Run Checkov
        run: make checkov

  # ============================================================
  # TRIVY - optimized: reuse Docker layers (no --no-cache), pip cache
  # ============================================================

  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned Trivy
        run: |
          scripts/ci/install-trivy.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan source and Terraform
        run: trivy fs --config trivy.yaml --scanners vuln,secret,misconfig .

      # OPTIMIZED: --no-cache removed -> layer reuse when Dockerfile/requirements unchanged. ~40% faster on cache hit.
      - name: Build SQL administration image
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            -f ops/sql-admin/Dockerfile \
            -t sql-admin:ci \
            .

      - name: Smoke-test SQL administration image without AWS
        run: scripts/ci/sql-admin-smoke.sh sql-admin:ci

      - name: Scan SQL administration image
        run: trivy image --config trivy.yaml --scanners vuln,secret sql-admin:ci

  # ============================================================
  # SONARQUBE
  # ============================================================

  sonar:
    name: SonarQube quality gate
    needs:
      - unit
    if: >-
      needs.unit.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ fromJSON(vars.SONAR_RUNNER_LABELS_JSON || '["ubuntu-24.04"]') }}
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Python coverage
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-coverage

      - name: Validate SonarQube configuration
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          test -s coverage.xml
          [[ "$SONAR_HOST_URL" == https://* ]] || {
            echo "SONAR_HOST_URL must use HTTPS."
            exit 1
          }
          [[ -n "$SONAR_PROJECT_KEY" ]] || {
            echo "SONAR_PROJECT_KEY is not configured."
            exit 1
          }
          [[ -n "$SONAR_TOKEN" ]] || {
            echo "SONAR_TOKEN is not configured."
            exit 1
          }

      - name: SonarQube scan
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ROOT_CERT: ${{ secrets.SONAR_ROOT_CERT }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  # ============================================================
  # TERRAFORM PR VALIDATION - matrix parallel (4x faster than sequential)
  # ============================================================

  terraform:
    name: Terraform checks (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        root: [environments/dev, environments/prod]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Terraform format check
        run: |
          terraform fmt -recursive -check -diff

      - name: Terraform init
        working-directory: ${{ matrix.root }}
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -lockfile=readonly

      - name: Terraform validate
        working-directory: ${{ matrix.root }}
        run: |
          terraform validate

      - name: Terraform provider-mocked checks
        env:
          ROOT: ${{ matrix.root }}
        run: |
          scripts/ci/terraform-checks.sh "$ROOT"

  # ============================================================
  # AGGREGATE PR GATE
  # ============================================================

  checks:
    name: All required checks
    if: always()
    needs: [unit, sonar, checkov, trivy, terraform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          echo "$RESULTS" |
            jq -e 'all(.[]; .result == "success")' > /dev/null || {
              echo "One or more required checks failed, were cancelled, or were skipped."
              echo "Merge and deployment are blocked."
              exit 1
            }
          echo "All required checks passed."

  # ============================================================
  # DEPLOY INFRASTRUCTURE
  # ============================================================

  deploy:
    name: Deploy ${{ github.ref_name }} infrastructure
    needs: checks
    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/main'
      )

    environment:
      name: ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 135

    permissions:
      contents: read
      id-token: write

    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Terraform format check
        run: |
          terraform fmt -recursive -check -diff

      - name: Validate deployment configuration
        id: inputs
        run: python3 scripts/ci/write_deploy_config.py


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 7200
          role-session-name: infrastructure-${{ env.DEPLOY_ENV }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "Expected AWS account: $AWS_ACCOUNT_ID"
          echo "Actual AWS account:   $ACCOUNT"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID"

      - name: Terraform plan and apply
        env:
          ROOT: ${{ steps.inputs.outputs.root }}
          BACKEND: ${{ steps.inputs.outputs.backend }}
        run: |
          set -Eeuo pipefail
          umask 077
          plan="$RUNNER_TEMP/infrastructure.tfplan"
          json_plan="$RUNNER_TEMP/infrastructure.tfplan.json"
          trap 'rm -f -- "$plan" "$json_plan" "$BACKEND" "$ROOT/ci.auto.tfvars.json"' EXIT
          echo "Environment: $DEPLOY_ENV"
          echo "Terraform root: $ROOT"
          echo "Initializing Terraform..."
          terraform -chdir="$ROOT" init \
            -reconfigure \
            -backend-config="$BACKEND" \
            -lockfile=readonly
          test "$(terraform -chdir="$ROOT" workspace show)" = default
          echo "Creating Terraform plan..."
          terraform -chdir="$ROOT" plan -no-color -lock-timeout=10m -out="$plan"
          echo "Validating saved Terraform plan..."
          terraform -chdir="$ROOT" show -json "$plan" > "$json_plan"
          python3 scripts/ci/verify_plan.py "$json_plan"
          echo "Applying exact saved Terraform plan..."
          terraform -chdir="$ROOT" apply -no-color -lock-timeout=10m "$plan"
          echo ""
          echo "============================================"
          echo "Infrastructure deployment completed"
          echo "Environment: $DEPLOY_ENV"
          echo "============================================"
