# SonarQube / SonarCloud analysis — PROD stack
#
# Used by the "SonarQube Analysis (Prod)" job in .github/workflows/prod.yml
# (canonical copy: prod.workflow.yml) via
#
#     -Dproject.settings=sonar-project-prod.properties
#
# One properties file per environment so dev/ and prod/ report as two separate
# SonarQube projects. A single shared file would still have to override
# sonar.projectKey per pipeline, and this keeps each stack's scope readable.
#
# Note: `sonar.projectName` deliberately has spaces in it. That is fine here
# but not on the scanner CLI, where `args` is word-split — which is why the
# workflow passes only -Dproject.settings and leaves everything else in here.


sonar.organization=agrovesto
sonar.projectKey=agrovesto-infrastructure-prod
sonar.projectName=Agrovesto infrastructure (prod)

# Only the prod stack is in scope for this pipeline. The dev pipeline scans
# dev/ from sonar-project-dev.properties.
sonar.sources=prod

# Terraform plus the templates, test suites and shell around it. Files whose
# extension SonarQube does not know are indexed as plain text, which still
# gives duplication and file-level metrics.
sonar.inclusions=**/*.tf,**/*.tftest.hcl,**/*.tftpl,**/*.sh,**/*.yml,**/*.yaml,**/*.md,**/*.json

# Provider cache, state and plan output never belong in a report.
sonar.exclusions=**/.terraform/**,**/*.tfstate,**/*.tfstate.*,**/tfplan*,**/coverage.json,**/test-results.json

# Full-history checkout in the workflow gives SonarQube the blame data it needs
# for the new-code period.
sonar.scm.provider=git

# Quality Gate enforcement (wait for Quality Gate result from SonarQube / SonarCloud)
sonar.qualitygate.wait=true

# Coverage report path (if converted to SonarQube Generic Coverage XML format)
# sonar.coverageReportPaths=prod/sonar-coverage.xml

sonar.links.homepage=https://github.com/Agrovesto/infrastructure
sonar.links.scm=https://github.com/Agrovesto/infrastructure.git
sonar.links.issue=https://github.com/Agrovesto/infrastructure/issues
# Terraform tests and templates are measured by scripts/tf_coverage.py, not by Sonar.
sonar.tests=prod
sonar.test.inclusions=**/tests/**,**/*.tftest.hcl
sonar.coverage.exclusions=**/*
sonar.cpd.exclusions=**/tests/**,**/*.tftest.hcl,**/*.tftpl,**/*.md,**/*.json