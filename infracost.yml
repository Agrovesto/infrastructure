version: 2.1

# One config file covering both environments for local runs:
#   infracost breakdown --config-file infracost.yml
#   infracost diff      --config-file infracost.yml
# (the CI jobs don't use this file; they call --path=dev / --path=prod directly)

projects:
  - path: dev
    name: agrovesto-dev
    terraform_var_files:
      - terraform.auto.tfvars
    terraform:
      usage_file: infracost-usage.yml

  - path: prod
    name: agrovesto-prod
    terraform_var_files:
      - terraform.auto.tfvars
    terraform:
      usage_file: infracost-usage.yml
