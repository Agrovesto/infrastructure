# SonarQube / SonarCloud analysis — MONITORING stack
#
# Used by the "SonarQube Analysis (Monitoring)" job in
# .github/workflows/monitoring.yml (canonical copy: monitoring.workflow.yml) via
#
#     -Dproject.settings=sonar-project-monitoring.properties
#
# One properties file per stack so dev, prod and monitoring report as three
# separate SonarQube projects. `sonar.projectName` deliberately has spaces in
# it: the workflow passes only -Dproject.settings because `args` is word-split
# on the scanner CLI.
sonar.organization=agrovesto
sonar.projectKey=agrovesto-infrastructure-monitoring
sonar.projectName=Agrovesto infrastructure (monitoring)

# Only the monitoring stack is in scope for this pipeline.
sonar.sources=monitoring

# Terraform plus the JSON dashboards, the budget script and the test suites.
sonar.inclusions=**/*.tf,**/*.tftest.hcl,**/*.py,**/*.json,**/*.md,**/*.yml,**/*.yaml

# Provider cache, state, plan output and generated reports never belong in a report.
sonar.exclusions=**/.terraform/**,**/*.tfstate,**/*.tfstate.*,**/tfplan*,**/coverage.json,**/test-results.json

# Full-history checkout in the workflow gives SonarQube the blame data it needs
# for the new-code period.
sonar.scm.provider=git

sonar.qualitygate.wait=true

sonar.links.homepage=https://github.com/Agrovesto/infrastructure
sonar.links.scm=https://github.com/Agrovesto/infrastructure.git
sonar.links.issue=https://github.com/Agrovesto/infrastructure/issues
# Terraform tests and templates are measured by scripts/tf_coverage.py, not by Sonar.
sonar.tests=monitoring
sonar.test.inclusions=**/tests/**,**/*.tftest.hcl
sonar.coverage.exclusions=**/*
sonar.cpd.exclusions=**/tests/**,**/*.tftest.hcl,**/*.tftpl,**/*.md,**/*.json

# Add this line:
sonar.terraform.provider.aws.version=5.40