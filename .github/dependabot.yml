version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /ops/sql-admin
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ops/sql-admin
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directories:
      - /environments/dev
      - /environments/prod
      - /bootstrap/dev
      - /bootstrap/prod
    schedule:
      interval: weekly
