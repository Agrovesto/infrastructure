name: Infrastructure

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.event.pull_request.number || github.ref_name }}
  # Never cancel an in-flight Terraform operation.
  # Queue subsequent runs for the same PR/branch.
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:

  # ============================================================
  # UNIT TESTS
  # ============================================================

  unit:
    name: Unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d4953c4e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          make unit

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 3
          if-no-files-found: error

  # ============================================================
  # CHECKOV
  #
  # Intentional architecture decisions:
  # CKV_AWS_157: RDS Single-AZ is intentional.
  # CKV2_AWS_28: Public ALB without WAF is intentional.
  # These are explicitly excluded.
  # All other Checkov policies remain enforced.
  # ============================================================

  checkov:
    name: Checkov
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d4953c4e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov==3.2.471

      - name: Run Checkov
        run: |
          checkov \
            --directory . \
            --skip-check CKV_AWS_157 \
            --skip-check CKV2_AWS_28 \
            --quiet

  # ============================================================
  # TRIVY
  #
  # Intentional architecture decisions:
  # AVD-AWS-0053: Public ALB is intentional.
  # AVD-AWS-0104: HTTPS outbound access via 0.0.0.0/0:443 is intentional.
  # Only these specific findings are ignored.
  # All other Trivy failures remain fatal.
  # ============================================================

  trivy:
    name: Trivy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install checksum-pinned Trivy
        run: |
          scripts/ci/install-trivy.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Create Trivy ignore file
        run: |
          cat > "$RUNNER_TEMP/trivyignore" <<'EOF'
          # Public ALB is intentional for the edge layer.
          # WAF is not currently part of this architecture.
          AVD-AWS-0053

          # HTTPS outbound access via 0.0.0.0/0:443 is intentional.
          AVD-AWS-0104
          EOF

      - name: Scan source and Terraform
        run: |
          trivy fs \
            --config trivy.yaml \
            --ignorefile "$RUNNER_TEMP/trivyignore" \
            --scanners vuln,secret,misconfig \
            .

      - name: Build SQL administration image
        run: |
          docker build \
            --pull \
            --platform linux/amd64 \
            -f ops/sql-admin/Dockerfile \
            -t sql-admin:ci \
            .

      - name: Scan SQL administration image
        run: |
          trivy image \
            --config trivy.yaml \
            --scanners vuln,secret \
            sql-admin:ci

  # ============================================================
  # SONARQUBE
  #
  # The job itself is never skipped for PRs.
  # Same-repository PR: Run the SonarQube scan.
  # Fork PR: Do not expose Sonar credentials. Explicitly skip only the scan.
  # Job still completes successfully.
  # ============================================================

  sonar:
    name: SonarQube quality gate

    needs:
      - unit

    if: always() && github.event_name == 'pull_request'

    runs-on: ${{ fromJSON(vars.SONAR_RUNNER_LABELS_JSON || '["ubuntu-24.04"]') }}

    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Python coverage
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-coverage

      - name: Skip SonarQube for fork pull request
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "This pull request originates from a fork."
          echo "SonarQube credentials are not exposed to forked pull requests."
          echo "SonarQube scan will not be executed."
          echo "The SonarQube job will complete successfully."

      - name: Validate SonarQube configuration
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          [[ "$SONAR_HOST_URL" == https://* ]] || {
            echo "SONAR_HOST_URL must use HTTPS."
            exit 1
          }

          [[ -n "$SONAR_PROJECT_KEY" ]] || {
            echo "SONAR_PROJECT_KEY is not configured."
            exit 1
          }

          [[ -n "$SONAR_TOKEN" ]] || {
            echo "SONAR_TOKEN is not configured."
            exit 1
          }

      - name: SonarQube scan
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ROOT_CERT: ${{ secrets.SONAR_ROOT_CERT }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  # ============================================================
  # TERRAFORM PR VALIDATION
  #
  # PR -> dev: environments/dev
  # PR -> main: environments/prod
  # IMPORTANT: No AWS credentials are requested during PR validation.
  # Checks:
  # 1. terraform fmt
  # 2. terraform init -backend=false
  # 3. terraform validate
  # 4. Existing provider-mocked Terraform checks
  # ============================================================

  terraform:
    name: Terraform checks (${{ github.base_ref }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Terraform format check
        run: |
          terraform fmt -recursive -check -diff

      # --------------------------------------------------------
      # DEV
      # --------------------------------------------------------

      - name: Terraform init - dev
        if: github.base_ref == 'dev'
        working-directory: environments/dev
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -lockfile=readonly

      - name: Terraform validate - dev
        if: github.base_ref == 'dev'
        working-directory: environments/dev
        run: |
          terraform validate

      - name: Terraform provider-mocked checks - dev
        if: github.base_ref == 'dev'
        env:
          ROOT: environments/dev
        run: |
          scripts/ci/terraform-checks.sh "$ROOT"

      # --------------------------------------------------------
      # PROD
      # --------------------------------------------------------

      - name: Terraform init - prod
        if: github.base_ref == 'main'
        working-directory: environments/prod
        run: |
          terraform init \
            -backend=false \
            -input=false \
            -lockfile=readonly

      - name: Terraform validate - prod
        if: github.base_ref == 'main'
        working-directory: environments/prod
        run: |
          terraform validate

      - name: Terraform provider-mocked checks - prod
        if: github.base_ref == 'main'
        env:
          ROOT: environments/prod
        run: |
          scripts/ci/terraform-checks.sh "$ROOT"

  # ============================================================
  # AGGREGATE PR GATE
  #
  # Every PR to dev/main must pass:
  # - Unit tests
  # - SonarQube
  # - Checkov
  # - Trivy
  # - Terraform
  # Configure "All required checks" as a required status check
  # in GitHub branch protection/rulesets.
  # ============================================================

  checks:
    name: All required checks
    if: always() && github.event_name == 'pull_request'
    needs:
      - unit
      - sonar
      - checkov
      - trivy
      - terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          echo "$RESULTS"

          echo "$RESULTS" |
            jq -e '
              all(.[]; .result == "success")
            ' > /dev/null || {
              echo "One or more required checks failed or were skipped."
              echo "Merge is blocked."
              exit 1
            }

          echo "All required PR checks passed."

  # ============================================================
  # DEPLOY INFRASTRUCTURE
  #
  # push -> dev: GitHub Environment: dev, Terraform root: environments/dev
  # push -> main: GitHub Environment: prod, Terraform root: environments/prod
  # Infrastructure only. No application build. No application deployment.
  # ============================================================

  deploy:
    name: Deploy ${{ github.ref_name }} infrastructure

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/main'
      )

    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    runs-on: ubuntu-24.04

    timeout-minutes: 135

    permissions:
      contents: read
      id-token: write

    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Terraform format check
        run: |
          terraform fmt -recursive -check -diff

      - name: Validate deployment configuration
        id: inputs
        run: |
          python3 scripts/ci/write_deploy_config.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 7200
          role-session-name: infrastructure-${{ env.DEPLOY_ENV }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Verify AWS identity
        run: |
          set -euo pipefail

          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"

          echo "Expected AWS account: $AWS_ACCOUNT_ID"
          echo "Actual AWS account:   $ACCOUNT"

          test "$ACCOUNT" = "$AWS_ACCOUNT_ID"

      - name: Terraform plan and apply
        env:
          ROOT: ${{ steps.inputs.outputs.root }}
          BACKEND: ${{ steps.inputs.outputs.backend }}
        run: |
          set -Eeuo pipefail
          umask 077

          plan="$RUNNER_TEMP/infrastructure.tfplan"
          json_plan="$RUNNER_TEMP/infrastructure.tfplan.json"

          trap 'rm -f -- "$plan" "$json_plan" "$BACKEND" "$ROOT/ci.auto.tfvars.json"' EXIT

          echo "Environment: $DEPLOY_ENV"
          echo "Terraform root: $ROOT"

          echo "Initializing Terraform..."

          terraform -chdir="$ROOT" init \
            -reconfigure \
            -backend-config="$BACKEND" \
            -lockfile=readonly

          test "$(terraform -chdir="$ROOT" workspace show)" = default

          echo "Creating Terraform plan..."

          terraform -chdir="$ROOT" plan -no-color -lock-timeout=10m -out="$plan"

          echo "Validating saved Terraform plan..."

          terraform -chdir="$ROOT" show \
            -json \
            "$plan" > "$json_plan"

          python3 scripts/ci/verify_plan.py "$json_plan"

          echo "Applying exact saved Terraform plan..."

          terraform -chdir="$ROOT" apply \
            -no-color \
            -lock-timeout=10m \
            "$plan"

          echo ""
          echo "============================================"
          echo "Infrastructure deployment completed"
          echo "Environment: $DEPLOY_ENV"
          echo "============================================"
