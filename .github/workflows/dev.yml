# Canonical copy of the dev pipeline. Install with:
#   cp dev.workflow.yml .github/workflows/dev.yml   (the automation token cannot push .github/workflows).
name: "Terraform CI/CD Pipeline (Dev)"

on:
  pull_request:
    branches:
      - dev
    paths:
      - "dev/**"
  push:
    branches:
      - dev
    paths:
      - "dev/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: "eu-west-1"
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_COVERAGE_FAIL_UNDER: "60"
  TF_WORKING_DIR: "dev"
  TF_ROOT_FILES: "versions.tf variables.tf locals.tf outputs.tf"
  TF_TEMPLATES: "user_data.sh.tftpl docker-compose.yml.tftpl nginx.conf.tftpl"
  TF_VAR_mssql_sa_password: ${{ secrets.TF_VAR_MSSQL_SA_PASSWORD_DEV }}

jobs:

  security-scan:
    name: "Lint & Security Scan"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Checkov IaC Scan
        id: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          config_file: dev/checkov.yml
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Store Checkov Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-sarif
          path: results.sarif
          retention-days: 14
          if-no-files-found: ignore

      - name: Trivy Scan (vuln + secret + misconfig)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: dev
          trivy-config: dev/trivy.yml
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Store Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Build Scan Summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Scan Summary"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Repository | `${{ github.repository }}` |"
            echo "| Branch / ref | `${{ github.ref_name }}` (`${{ github.ref }}`) |"
            echo "| Commit | `${{ github.sha }}` |"
            echo "| Trigger | `${{ github.event_name }}` by @${{ github.actor }} |"
            echo "| Run | [#${{ github.run_number }} of `${{ github.workflow }}`]($RUN_URL) |"
            echo "| Terraform dir | `${{ env.TF_WORKING_DIR }}` |"
            echo "| Checkov step | `${{ steps.checkov.outcome }}` |"
            echo "| Trivy step | `${{ steps.trivy.outcome }}` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PYEOF'
          import collections
          import json
          import os
          import pathlib

          out = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = []

          sarif = pathlib.Path("results.sarif")
          if sarif.exists() and sarif.stat().st_size:
              try:
                  results = json.loads(sarif.read_text())["runs"][0].get("results", [])
              except Exception as exc:
                  results = None
                  lines.append("### Checkov")
                  lines.append("")
                  lines.append("could not parse results.sarif: %s" % exc)
                  lines.append("")
              if results is not None:
                  lines.append("### Checkov")
                  lines.append("")
                  if not results:
                      lines.append("PASS: no failed checks")
                      lines.append("")
                  else:
                      by_level = collections.Counter(r.get("level", "error") for r in results)
                      by_rule = collections.Counter(r["ruleId"] for r in results)
                      lines.append("FAIL: %d findings (errors %d, warnings %d, notes %d)" % (
                          len(results),
                          by_level.get("error", 0),
                          by_level.get("warning", 0),
                          by_level.get("note", 0),
                      ))
                      lines.append("")
                      lines.append("| Rule | Findings |")
                      lines.append("| --- | --- |")
                      for rule, count in by_rule.most_common(15):
                          lines.append("| `%s` | %d |" % (rule, count))
                      lines.append("")
          else:
              lines.append("### Checkov")
              lines.append("")
              lines.append("PASS: no SARIF report produced (no findings)")
              lines.append("")

          trivy = pathlib.Path("trivy-report.txt")
          lines.append("### Trivy (Vulnerabilities, Secrets & Misconfigurations)")
          lines.append("")
          if trivy.exists() and trivy.stat().st_size > 0:
              report_text = trivy.read_text(errors="replace")
              if "CRITICAL" in report_text or "HIGH" in report_text:
                  crit = report_text.count("CRITICAL")
                  high = report_text.count("HIGH")
                  lines.append("⚠️ **FAIL:** Findings detected (%d CRITICAL, %d HIGH)" % (crit, high))
              else:
                  lines.append("✅ **PASS:** Scan completed cleanly with no HIGH/CRITICAL findings.")
              lines.append("")
              lines.append("<details open><summary>📋 Full Trivy Scan Report</summary>")
              lines.append("")
              lines.append("```text")
              lines.append(report_text[:30000])
              lines.append("```")
              lines.append("</details>")
              lines.append("")
          else:
              lines.append("✅ **PASS:** No HIGH or CRITICAL findings detected by Trivy.")
              lines.append("")

          with out.open("a") as fh:
              fh.write("\n".join(lines) + "\n")
          PYEOF

  terraform-test:
    name: "Terraform Test & Coverage"
    needs:
      - security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (backend=false)
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform Test
        id: test
        run: |
          set -o pipefail
          terraform test -no-color -json 2>test-stderr.log | tee test-results.json
          echo
          echo "--- terraform test stderr ---"
          cat test-stderr.log

      - name: Compute Test Coverage
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/tf_coverage.py "${{ env.TF_WORKING_DIR }}" \
            --test-json "${{ env.TF_WORKING_DIR }}/test-results.json" \
            --fail-under "${{ env.TF_COVERAGE_FAIL_UNDER }}" \
            --json "${{ env.TF_WORKING_DIR }}/coverage.json" \
            --summary-md coverage.md

          {
            echo ''
            cat coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test + Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TF_WORKING_DIR }}-terraform-test
          path: |
            ${{ env.TF_WORKING_DIR }}/test-results.json
            ${{ env.TF_WORKING_DIR }}/test-stderr.log
            ${{ env.TF_WORKING_DIR }}/coverage.json
            coverage.md
          retention-days: 14
          if-no-files-found: ignore

  sonarqube-scan:
    name: "SonarQube Analysis (Dev)"
    needs:
      - security-scan
      - terraform-test
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SonarQube Credentials
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not set; skipping the SonarQube scan. The SonarQube Summary step records the skip in the job summary."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        if: steps.sonar.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: -Dproject.settings=sonar-project-dev.properties

      - name: SonarQube Summary
        if: always()
        env:
          OUTCOME: ${{ steps.sonar.outputs.configured == 'true' && 'scanned' || 'skipped' }}
          CREDENTIALS: ${{ steps.sonar.outputs.configured == 'true' && 'present' || 'absent' }}
        run: |
          {
            echo ''
            echo '## SonarQube (Dev)'
            echo ''
            echo '| | |'
            echo '| --- | --- |'
            echo "| Outcome | \`$OUTCOME\` |"
            echo "| Credentials | \`$CREDENTIALS\` |"
            echo '| Config file | `sonar-project-dev.properties` |'
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  infracost:

    name: "Infracost Cost Estimate"

    needs:
      - terraform-plan

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:

      - name: Check Infracost API Key
        id: infracost
        env:
          INFRACOST_API_KEY: ${ secrets.INFRACOST_API_KEY }
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::INFRACOST_API_KEY is not set; skipping the cost estimate."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout Base Revision
        if: steps.infracost.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${ github.event.pull_request.base.sha }
          path: base

      - name: Checkout Head Revision
        if: steps.infracost.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          path: head

      - name: Setup Terraform
        if: steps.infracost.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${ env.TF_VERSION }

      - name: Setup Infracost
        if: steps.infracost.outputs.configured == 'true'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${ secrets.INFRACOST_API_KEY }

      - name: Configure AWS Credentials (OIDC)
        if: steps.infracost.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${ env.AWS_ROLE_ARN }
          aws-region: ${ env.AWS_REGION }
          audience: sts.amazonaws.com

      - name: Cost Estimate For The Base Revision
        if: steps.infracost.outputs.configured == 'true'
        run: |
          if [ ! -d base/dev ]; then
            echo "::notice::The base revision has no dev/ directory; its cost is treated as zero."
            echo '{"version":"0.2","projects":[],"totalMonthlyCost":"0"}' > /tmp/infracost-base.json
            exit 0
          fi
          infracost breakdown --path base/dev --format json --out-file /tmp/infracost-base.json --no-color

      - name: Cost Estimate For This Pull Request
        if: steps.infracost.outputs.configured == 'true'
        run: |
          infracost breakdown --path head/dev --format json --out-file /tmp/infracost-head.json --no-color
          infracost diff --path head/dev --compare-to /tmp/infracost-base.json --format json --out-file /tmp/infracost-diff.json --no-color

      - name: Publish Cost Estimate
        if: steps.infracost.outputs.configured == 'true'
        run: |
          infracost comment github \
            --path /tmp/infracost-diff.json \
            --repo "$GITHUB_REPOSITORY" \
            --pull-request "${ github.event.pull_request.number }" \
            --github-token "${ secrets.GITHUB_TOKEN }" \
            --behavior update

  terraform-plan:
    name: "Terraform Plan & PR Diff"
    needs:
      - security-scan
      - terraform-test
      - sonarqube-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Terraform Root Module
        run: |

          echo "Workspace:"
          pwd

          echo
          echo "Terraform working directory:"
          echo "${{ env.TF_WORKING_DIR }}"

          echo
          echo "Repository contents:"
          ls -la

          for file in ${{ env.TF_ROOT_FILES }} ${{ env.TF_TEMPLATES }}; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing '$file' in the Terraform root module."
              exit 1
            fi
          done

          echo
          echo "Terraform root module verified."

          if [ -f terraform.auto.tfvars ]; then
            echo
            echo "terraform.auto.tfvars is present (auto-loaded by terraform)."
          else
            echo
            echo "::warning::No terraform.auto.tfvars found; required variables must come from TF_VAR_* env vars."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        id: init
        run: terraform init -no-color

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan

          terraform show \
            -no-color \
            tfplan > tfplan.txt

      - name: Publish Plan to Pull Request
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_FILE: ${{ github.workspace }}/${{ env.TF_WORKING_DIR }}/tfplan.txt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |

            const fs = require("fs");

            let planOutput = "";

            try {

              planOutput = fs.readFileSync(
                process.env.PLAN_FILE,
                "utf8"
              );

              if (planOutput.length > 60000) {

                planOutput =
                  planOutput.substring(0, 60000) +
                  "\n... [Output truncated. Check the workflow logs for the full plan.]";

              }

            } catch (error) {

              planOutput =
                "Terraform plan output could not be read.\n\n" +
                error.message;

            }

            const summary = [
              `**Init:** \`${{ steps.init.outcome }}\``,
              `**Validate:** \`${{ steps.validate.outcome }}\``,
              `**Plan:** \`${{ steps.plan.outcome }}\``
            ].join("  \n");

            const output = [
              "### 🚀 Terraform Plan",
              "",
              summary,
              "",
              "<details>",
              "<summary>📖 Show Terraform Diff / Plan</summary>",
              "",
              "```terraform",
              planOutput,
              "```",
              "",
              "</details>",
              "",
              `*Pushed by: @${{ github.actor }} | Event: \`${{ github.event_name }}\`*`
            ].join("\n");

            await github.rest.issues.createComment({

              owner: context.repo.owner,
              repo: context.repo.repo,

              issue_number: context.issue.number,

              body: output

            });

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: "Terraform Apply (Dev)"
    needs:
      - security-scan
      - terraform-test
      - sonarqube-scan
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Terraform Root Module
        run: |

          echo "Terraform working directory (repo root):"
          pwd

          echo
          ls -la

          for file in ${{ env.TF_ROOT_FILES }} ${{ env.TF_TEMPLATES }}; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing '$file' in the Terraform root module."
              exit 1
            fi
          done

          echo
          echo "Terraform root module verified."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan \
          -no-color \
          -input=false

      - name: Terraform Apply
        run: terraform apply \
          -auto-approve \
          -input=false
