# =============================================================================
#  Terraform CI/CD Pipeline  (Agrovesto / dev account)
# =============================================================================

name: "Terraform CI/CD Pipeline"

on:
  pull_request:
    branches: [main, dev, devops]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftpl"
      - "**/infracost-usage.yml"
      - ".github/workflows/dev.yml"
      - "checkov.yml"
      - "trivy.yml"
  push:
    branches: [main, dev]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftpl"
      - "**/infracost-usage.yml"
      - ".github/workflows/dev.yml"
      - "checkov.yml"
      - "trivy.yml"

# Only one run per ref at a time; supersede older queued runs on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write            # AWS OIDC authentication
  contents: read
  pull-requests: write       # Post Terraform plan + Infracost on PRs

env:
  # The dev account's resources are created in eu-west-1 (see dev.auto.tfvars).
  # Region is also used by configure-aws-credentials for the OIDC STS call.
  AWS_REGION: "eu-west-1"
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  TF_VERSION: "1.6.6"
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: "environments/dev"
  TF_VAR_mssql_sa_password: ${{ secrets.TF_VAR_MSSQL_SA_PASSWORD }}
  # Optional: set the INFRACOST_API_KEY secret to enable the Infracost job.
  # The key is checked in the terraform-plan job (a job-level `if` cannot read
  # the env context) and the result is passed on as a job output.

jobs:
  # ==============================================================
  # STAGE 1: LINT & SECURITY SCAN (CHECKOV + TRIVY)
  # No AWS credentials needed. Scans run from the repo root so the
  # committed checkov.yml / trivy.yml (with the dev skip-list) are used.
  # ==============================================================
  security-scan:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Checkov IaC Scan
        id: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0 (pinned SHA)
        with:
          config_file: checkov.yml # skip list is NOT auto-discovered (wrong filename for that)
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      - name: Store Checkov report (artifact)
        # Code scanning requires GitHub Advanced Security (paid on private
        # repos), so scan results live in the job log + this artifact instead.
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-sarif
          path: results.sarif
          retention-days: 14
          if-no-files-found: ignore

      - name: Trivy Misconfiguration Scan
        id: trivy
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned SHA)
        with:
          scan-type: config
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
        continue-on-error: true

  # ==============================================================
  # STAGE 2: TERRAFORM PLAN & PR DIFF COMMENT (PULL REQUESTS)
  # ==============================================================
  terraform-plan:
    name: Terraform Plan & Diff
    needs: security-scan
    if: github.event_name == 'pull_request'
    # Job-level `if` cannot read the env/secrets contexts, so the Infracost
    # key check happens in a step below and is exported for the infracost job.
    outputs:
      infracost_enabled: ${{ steps.infracost_gate.outputs.enabled }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Infracost gate (is the API key secret set?)
        id: infracost_gate
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "$INFRACOST_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "INFRACOST_API_KEY secret not set — the cost-estimate job will be skipped."
          fi

      - name: Inspect GitHub OIDC claims
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -euo pipefail

          TOKEN_JSON="$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")"

          python3 - "$TOKEN" <<'PY'
          import base64
          import json
          import sys

          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode("utf-8")
          )

          for key in ("iss", "aud", "sub", "repository", "ref", "event_name"):
              print(f"{key}: {claims.get(key)}")
          PY
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform Init
        id: init
        run: terraform init -no-color

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan \
            && terraform show -no-color tfplan > tfplan.txt
        continue-on-error: true

      - name: Publish Plan to Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = "";
            // github-script runs from the workspace root, not the Terraform
            // directory, so read the plan file via TF_WORKING_DIR.
            const planFile = process.env.TF_WORKING_DIR + '/tfplan.txt';
            try {
              planOutput = fs.readFileSync(planFile, 'utf8');
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) +
                  "\n... [Output Truncated - Check Job Log for Full Diff]";
              }
            } catch (err) {
              planOutput = '${{ steps.plan.outcome }}' === 'failure'
                ? "⚠️ terraform plan failed — open the job log above to see the errors."
                : "Error reading plan file: " + planFile;
            }

            const summary = [
              "**Init:** `${{ steps.init.outcome }}`",
              "**Validate:** `${{ steps.validate.outcome }}`",
              "**Plan:** `${{ steps.plan.outcome }}`"
            ].join("  \n");

            const output = `### 🚀 Terraform Plan
            \n${summary}
            \n<details><summary>📖 Show Terraform Diff / Plan</summary>
            \n\`\`\`terraform
            \n${planOutput}
            \n\`\`\`
            \n</details>
            \n*Pushed by: @${{ github.actor }} | Event: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ==============================================================
  # STAGE 3 (PR ONLY): INFRACOST COST ESTIMATE
  # Runs only when the terraform-plan job found an INFRACOST_API_KEY secret.
  # ==============================================================
  infracost:
    name: Infracost (monthly cost diff)
    needs: terraform-plan
    if: github.event_name == 'pull_request' && needs.terraform-plan.outputs.infracost_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Infracost CLI
        uses: infracost/actions/setup@d51fc54d23c9ad90f984b884257bd96dc2625067 # v4.1.0 (pinned SHA)
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost cost-estimate baseline
        run: |
          USAGE_FILE="${{ env.TF_WORKING_DIR }}/infracost-usage.yml"
          USAGE_ARGS=()
          [ -f "$USAGE_FILE" ] && USAGE_ARGS+=(--usage-file="$USAGE_FILE")
          infracost breakdown --path="${{ env.TF_WORKING_DIR }}" \
                              --project-name=agrovesto-dev \
                              "${USAGE_ARGS[@]}" \
                              --format=json \
                              --out-file=/tmp/infracost-base.json
        # The base branch may pre-date dev.auto.tfvars and fail on missing
        # variables; don't fail the whole job for that.
        continue-on-error: true

      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Generate Infracost diff
        id: infracost
        run: |
          USAGE_FILE="${{ env.TF_WORKING_DIR }}/infracost-usage.yml"
          USAGE_ARGS=()
          [ -f "$USAGE_FILE" ] && USAGE_ARGS+=(--usage-file="$USAGE_FILE")
          infracost diff --path="${{ env.TF_WORKING_DIR }}" \
                         --project-name=agrovesto-dev \
                         "${USAGE_ARGS[@]}" \
                         --format=json \
                         --compare-to=/tmp/infracost-base.json \
                         --out-file=/tmp/infracost.json
        continue-on-error: true

      - name: Post Infracost PR comment
        if: always() && steps.infracost.outcome == 'success'
        run: |
          infracost comment github --path=/tmp/infracost.json \
                                   --repo="${{ github.repository }}" \
                                   --github-token="${{ github.token }}" \
                                   --pull-request="${{ github.event.pull_request.number }}" \
                                   --behavior=update

  # ==============================================================
  # STAGE 4: TERRAFORM APPLY (PUSH TO DEV)
  # ==============================================================
  terraform-apply:
    name: Terraform Apply (dev)
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false