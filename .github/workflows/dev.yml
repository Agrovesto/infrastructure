name: "Terraform CI/CD Pipeline"

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/dev.yml"
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform-ci-cd.yml"

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout repository
  pull-requests: write # Required to comment Terraform plan on PRs
  security-events: write # Required to upload SARIF security scan results

env:
  AWS_REGION: "us-east-1"
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  TF_VERSION: "1.6.6"
  TF_VAR_mssql_sa_password: ${{ secrets.TF_VAR_MSSQL_SA_PASSWORD }}

jobs:
  # ==============================================================
  # STAGE 1: LINT & SECURITY SCAN (CHECKOV + TRIVY)
  # ==============================================================
  security-scan:
    name: "Static & Security Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Terraform Format Check"
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # --- CHECKOV SCAN ---
      - name: "Run Checkov Security Scan"
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true # Set to false if you want failed checks to block PRs
          download_external_modules: true

      - name: "Upload Checkov SARIF to GitHub Security"
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: results.sarif
          category: checkov-iac-scan

      # --- TRIVY SCAN ---
      - name: "Run Trivy Vulnerability & Misconfig Scan"
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-progress: false
          format: "table"
          exit-code: "1" # Change to '1' to fail on critical findings
          severity: "CRITICAL,HIGH"

      - name: "Run Trivy SARIF Report Generation"
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: "config"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: "Upload Trivy SARIF to GitHub Security"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-iac-scan

  # ==============================================================
  # STAGE 2: TERRAFORM PLAN & PR DIFF COMMENT (ON PULL REQUEST)
  # ==============================================================
  terraform-plan:
    name: "Terraform Plan & Diff"
    needs: [security-scan]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Configure AWS Credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Terraform Init"
        id: init
        run: terraform init

      - name: "Terraform Validate"
        id: validate
        run: terraform validate -no-color

      - name: "Terraform Plan"
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
          && terraform show -no-color tfplan > tfplan.txt
        continue-on-error: true

      - name: "Publish Plan to Pull Request"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = "";
            
            try {
              planOutput = fs.readFileSync('tfplan.txt', 'utf8');
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) + "\n... [Output Truncated - Check Job Log for Full Diff]";
              }
            } catch (err) {
              planOutput = "Error reading plan file.";
            }

            const output = `### 🚀 **Terraform Plan & Security Check**
            
            #### Status Summary:
            - **Format Check:** \`${{ steps.fmt.outcome }}\`
            - **Initialization:** \`${{ steps.init.outcome }}\`
            - **Validation:** \`${{ steps.validate.outcome }}\`
            - **Plan Status:** \`${{ steps.plan.outcome }}\`
            
            <details><summary>📖 Show Terraform Diff / Plan</summary>
            
            \`\`\`terraform
            ${planOutput}
            \`\`\`
            
            </details>
            
            *Pushed by: @${{ github.actor }} | Event: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: "Fail if Plan Failed"
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ==============================================================
  # STAGE 3: TERRAFORM APPLY (ON PUSH TO MAIN)
  # ==============================================================
  terraform-apply:
    name: "Terraform Apply (Deploy)"
    needs: [security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Configure AWS Credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Terraform Init"
        run: terraform init

      - name: "Terraform Apply"
        run: terraform apply -auto-approve -input=false