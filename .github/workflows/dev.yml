# =============================================================================
#  Terraform CI/CD Pipeline  (Agrovesto / dev account)
# =============================================================================

name: "Terraform CI/CD Pipeline"

on:
  pull_request:
    branches: [main, dev, devops]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftpl"
      - "**/infracost-usage.yml"
      - ".github/workflows/dev.yml"
      - "checkov.yml"
      - "trivy.yml"
  push:
    branches: [main, dev]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftpl"
      - "**/infracost-usage.yml"
      - ".github/workflows/dev.yml"
      - "checkov.yml"
      - "trivy.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write            
  pull-requests: write       

env:
  AWS_REGION: "eu-west-1"
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  TF_VERSION: "1.6.6"
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: "environments/dev"
  TF_VAR_mssql_sa_password: ${{ secrets.TF_VAR_MSSQL_SA_PASSWORD }}

jobs:
  # ==============================================================
  # STAGE 1: LINT & SECURITY SCAN (CHECKOV + TRIVY)  
  # ==============================================================
  security-scan:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Checkov IaC Scan
        id: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0 (pinned SHA)
        with:
          config_file: checkov.yml 
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      - name: Store Checkov report (artifact)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-sarif
          path: results.sarif
          retention-days: 14
          if-no-files-found: ignore

      - name: Trivy Misconfiguration Scan
        id: trivy
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned SHA)
        with:
          scan-type: config
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
        continue-on-error: true

  # ==============================================================
  # STAGE 2: TERRAFORM PLAN & PR DIFF COMMENT (PULL REQUESTS)
  # ==============================================================
  terraform-plan:
    name: Terraform Plan & Diff
    needs: security-scan
    if: github.event_name == 'pull_request'
    outputs:
      infracost_enabled: ${{ steps.infracost_gate.outputs.enabled }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Infracost gate (is the API key secret set?)
        id: infracost_gate
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "$INFRACOST_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "INFRACOST_API_KEY secret not set — the cost-estimate job will be skipped."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform Init
        id: init
        run: terraform init -no-color

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan \
            && terraform show -no-color tfplan > tfplan.txt

      - name: Publish Plan to Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = "";
            // github-script runs from the workspace root, not the Terraform
            // directory, so read the plan file via TF_WORKING_DIR.
            const planFile = process.env.TF_WORKING_DIR + '/tfplan.txt';
            try {
              planOutput = fs.readFileSync(planFile, 'utf8');
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) +
                  "\n... [Output Truncated - Check Job Log for Full Diff]";
              }
            } catch (err) {
              planOutput = '${{ steps.plan.outcome }}' === 'failure'
                ? "⚠️ terraform plan failed — open the job log above to see the errors."
                : "Error reading plan file: " + planFile;
            }

            const summary = [
              "**Init:** `${{ steps.init.outcome }}`",
              "**Validate:** `${{ steps.validate.outcome }}`",
              "**Plan:** `${{ steps.plan.outcome }}`"
            ].join("  \n");

            const output = `### 🚀 Terraform Plan
            \n${summary}
            \n<details><summary>📖 Show Terraform Diff / Plan</summary>
            \n\`\`\`terraform
            \n${planOutput}
            \n\`\`\`
            \n</details>
            \n*Pushed by: @${{ github.actor }} | Event: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ==============================================================
  # STAGE 3 (PR ONLY): INFRACOST COST ESTIMATE
  # Runs only when the terraform-plan job found an INFRACOST_API_KEY secret.
  # ==============================================================
  infracost:
    name: Infracost (monthly cost diff)
    needs: terraform-plan
    if: github.event_name == 'pull_request' && needs.terraform-plan.outputs.infracost_enabled == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Verify Terraform directory
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Terraform directory: ${{ env.TF_WORKING_DIR }}"
          echo "Contents:"
          ls -la
          echo
          echo "environments:"
          ls -la environments || true
          echo
          echo "Target:"
          ls -la "${{ env.TF_WORKING_DIR }}"

      # THEN: Setup infrastructure
      - name: Setup Infracost CLI
        uses: infracost/actions/setup@d51fc54d23c9ad90f984b884257bd96dc2625067
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform Init (base branch)
        working-directory: ${{env.TF_WORKING_DIR}}
        run: terraform init -no-color

      - name: Generate Infracost cost-estimate baseline
        env:
          TF_WORKING_DIR: ${{ env.TF_WORKING_DIR }}
        run: |
          USAGE_FILE="${TF_WORKING_DIR}/infracost-usage.yml"
          USAGE_ARGS=()

          if [ -f "$USAGE_FILE" ]; then
            USAGE_ARGS+=(--usage-file="$USAGE_FILE")
          fi

          infracost breakdown \
            --path="${TF_WORKING_DIR}" \
            --project-name=agrovesto-dev \
            "${USAGE_ARGS[@]}" \
            --format=json \
            --out-file=/tmp/infracost-base.json
        continue-on-error: true

      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Verify Terraform directory
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Terraform directory: ${{ env.TF_WORKING_DIR }}"
          echo "Contents:"
          ls -la
          echo
          echo "environments:"
          ls -la environments || true
          echo
          echo "Target:"
          ls -la "${{ env.TF_WORKING_DIR }}"
            - name: Terraform Init (PR branch)
              working-directory: ${{env.TF_WORKING_DIR}}
              run: terraform init -no-color

      - name: Generate Infracost diff
        id: infracost
        env:
          TF_WORKING_DIR: ${{ env.TF_WORKING_DIR }}
        run: |
          USAGE_FILE="${TF_WORKING_DIR}/infracost-usage.yml"
          USAGE_ARGS=()

          if [ -f "$USAGE_FILE" ]; then
            USAGE_ARGS+=(--usage-file="$USAGE_FILE")
          fi

          infracost diff \
            --path="${TF_WORKING_DIR}" \
            --project-name=agrovesto-dev \
            "${USAGE_ARGS[@]}" \
            --format=json \
            --compare-to=/tmp/infracost-base.json \
            --out-file=/tmp/infracost.json
        continue-on-error: true

      - name: Post Infracost PR comment
        if: always() && steps.infracost.outcome == 'success'
        run: |
          infracost comment github --path=/tmp/infracost.json \
                                   --repo="${{ github.repository }}" \
                                   --github-token="${{ github.token }}" \
                                   --pull-request="${{ github.event.pull_request.number }}" \
                                   --behavior=update

  # ==============================================================
  # STAGE 4: TERRAFORM APPLY (PUSH TO DEV)
  # ==============================================================
  terraform-apply:
    name: Terraform Apply (dev)
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false