# Dev account (353833416626): any PR into `dev` = checks + plan; any merge/push to `dev` = deploy.
name: "Terraform (dev)"

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: terraform-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  dev:
    uses: ./.github/workflows/terraform-pipeline.yml
    with:
      stack: dev
      environment: dev
      sonar_properties: sonar-project-dev.properties
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}
      TF_VAR_MSSQL_SA_PASSWORD: ${{ secrets.TF_VAR_MSSQL_SA_PASSWORD_DEV }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      GRAFANA_GITHUB_CLIENT_ID: ${{ secrets.GRAFANA_GITHUB_CLIENT_ID }}
      GRAFANA_GITHUB_CLIENT_SECRET: ${{ secrets.GRAFANA_GITHUB_CLIENT_SECRET }}
      SONARQUBE_GITHUB_CLIENT_ID: ${{ secrets.SONARQUBE_GITHUB_CLIENT_ID }}
      SONARQUBE_GITHUB_CLIENT_SECRET: ${{ secrets.SONARQUBE_GITHUB_CLIENT_SECRET }}
      SONARQUBE_GITHUB_APP_ID: ${{ secrets.SONARQUBE_GITHUB_APP_ID }}
      SONARQUBE_GITHUB_PRIVATE_KEY: ${{ secrets.SONARQUBE_GITHUB_PRIVATE_KEY }}
