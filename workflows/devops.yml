# Playground: PRs into / pushes to `devops` run every check (metadata, Checkov,
# Trivy, tests + coverage, SonarQube, Infracost, fmt, validate) for all three
# stacks. No AWS credentials, no plan, no deploy.
name: "Terraform (devops playground)"

on:
  pull_request:
    branches: [devops]
  push:
    branches: [devops]
  workflow_dispatch:

concurrency:
  group: terraform-devops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        stack: [dev, prod, monitoring]
    uses: ./.github/workflows/terraform-pipeline.yml
    with:
      stack: ${{ matrix.stack }}
      environment: playground
      deploy: false
      sonar_properties: sonar-project-${{ matrix.stack }}.properties
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
