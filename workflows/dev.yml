# Dev account (353833416626): PR into `dev` = checks + plan; push to `dev` = deploy.
name: "Terraform (dev)"

on:
  pull_request:
    branches: [dev]
    paths: ["dev/**", "scripts/**", "infracost-usage/dev.yml", "sonar-project-dev.properties", ".github/workflows/dev.yml", ".github/workflows/terraform-pipeline.yml"]
  push:
    branches: [dev]
    paths: ["dev/**", "scripts/**", "infracost-usage/dev.yml", "sonar-project-dev.properties", ".github/workflows/dev.yml", ".github/workflows/terraform-pipeline.yml"]
  workflow_dispatch:

concurrency:
  group: terraform-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  dev:
    uses: ./.github/workflows/terraform-pipeline.yml
    with:
      stack: dev
      environment: dev
      sonar_properties: sonar-project-dev.properties
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}
      TF_VAR_MSSQL_SA_PASSWORD: ${{ secrets.TF_VAR_MSSQL_SA_PASSWORD_DEV }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
