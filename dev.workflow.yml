# =============================================================================
# Terraform CI/CD Pipeline
# Agrovesto / Dev Account.
#
# FLAT LAYOUT: the whole stack (Terraform code, .tftpl templates, scan configs
# and this workflow) lives in the repository ROOT — there is no
# `environments/dev` or `modules/` tree any more. Every terraform/infracost
# command below therefore runs from the repo root (TF_WORKING_DIR = ".").
#
# INSTALL: this file is the canonical copy of the pipeline. Copy it into place
# with:
#
#     cp dev.workflow.yml .github/workflows/dev.yml
#
# (the automation token that manages this repo has no `workflows` permission,
# so it cannot commit into .github/workflows directly).
# =============================================================================

name: "Terraform CI/CD Pipeline"

# =============================================================================
# TRIGGERS
# =============================================================================

on:

  # ---------------------------------------------------------------------------
  # Pull Requests into dev
  # ---------------------------------------------------------------------------
  pull_request:
    branches:
      - dev

    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftpl"
      - "infracost-usage.yml"
      - "infracost.yml"
      - "dev.workflow.yml"
      - "checkov.yml"
      - "trivy.yml"

  # ---------------------------------------------------------------------------
  # Pushes to dev
  # ---------------------------------------------------------------------------
  push:
    branches:
      - dev

    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftpl"
      - "infracost-usage.yml"
      - "infracost.yml"
      - "dev.workflow.yml"
      - "checkov.yml"
      - "trivy.yml"


# =============================================================================
# CONCURRENCY
# =============================================================================

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# =============================================================================
# GITHUB TOKEN PERMISSIONS
# =============================================================================

permissions:
  contents: read
  id-token: write
  pull-requests: write


# =============================================================================
# GLOBAL ENVIRONMENT
# =============================================================================

env:

  # AWS
  AWS_REGION: "eu-west-1"
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # Terraform
  TF_VERSION: "1.6.6"
  TF_IN_AUTOMATION: "true"

  # The stack is the repository root now (was: environments/dev).
  TF_WORKING_DIR: "."

  # Files that must exist for this to be a valid Terraform root module.
  TF_ROOT_FILES: "versions.tf variables.tf locals.tf outputs.tf"
  TF_TEMPLATES: "user_data.sh.tftpl docker-compose.yml.tftpl nginx.conf.tftpl"

  # MSSQL
  TF_VAR_mssql_sa_password: ${{ secrets.TF_VAR_MSSQL_SA_PASSWORD }}


# =============================================================================
# JOBS
# =============================================================================

jobs:


  # ===========================================================================
  # STAGE 1
  # LINT + SECURITY SCAN
  # ===========================================================================

  security-scan:

    name: "Lint & Security Scan"

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # -----------------------------------------------------------------------
      # Terraform
      # -----------------------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # -----------------------------------------------------------------------
      # Terraform formatting
      # -----------------------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true


      # -----------------------------------------------------------------------
      # Checkov
      # -----------------------------------------------------------------------

      - name: Checkov IaC Scan
        id: checkov

        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0

        with:
          directory: ${{ env.TF_WORKING_DIR }}
          config_file: checkov.yml
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true


      # -----------------------------------------------------------------------
      # Store Checkov SARIF
      # -----------------------------------------------------------------------

      - name: Store Checkov Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: checkov-sarif
          path: results.sarif
          retention-days: 14
          if-no-files-found: ignore


      # -----------------------------------------------------------------------
      # Trivy IaC scan
      # -----------------------------------------------------------------------

      - name: Trivy Misconfiguration Scan
        id: trivy

        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0

        with:
          scan-type: config
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

        continue-on-error: true



  # ===========================================================================
  # STAGE 2
  # TERRAFORM PLAN
  # ===========================================================================

  terraform-plan:

    name: "Terraform Plan & PR Diff"

    needs:
      - security-scan

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    outputs:
      infracost_enabled: ${{ steps.infracost_gate.outputs.enabled }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout PR merge ref
      # -----------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------------------------------------------------
      # Verify Terraform root module
      # -----------------------------------------------------------------------

      - name: Verify Terraform Root Module
        run: |

          echo "Workspace:"
          pwd

          echo
          echo "Terraform working directory:"
          echo "${{ env.TF_WORKING_DIR }}"

          echo
          echo "Repository contents:"
          ls -la

          for file in ${{ env.TF_ROOT_FILES }} ${{ env.TF_TEMPLATES }}; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing '$file' in the Terraform root module."
              exit 1
            fi
          done

          echo
          echo "Terraform root module verified."

          if [ -f terraform.auto.tfvars ]; then
            echo
            echo "terraform.auto.tfvars is present (auto-loaded by terraform)."
          else
            echo
            echo "::warning::No terraform.auto.tfvars found; required variables must come from TF_VAR_* env vars."
          fi


      # -----------------------------------------------------------------------
      # Infracost gate
      # -----------------------------------------------------------------------

      - name: Infracost Gate
        id: infracost_gate

        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

        run: |
          if [ -n "$INFRACOST_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Infracost is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "INFRACOST_API_KEY is not configured."
            echo "The Infracost job will be skipped."
          fi


      # -----------------------------------------------------------------------
      # Terraform
      # -----------------------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

        with:
          terraform_version: ${{ env.TF_VERSION }}


      # -----------------------------------------------------------------------
      # AWS OIDC authentication
      # -----------------------------------------------------------------------

      - name: Configure AWS Credentials (OIDC)

        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com


      # -----------------------------------------------------------------------
      # Verify AWS identity
      # -----------------------------------------------------------------------

      - name: Verify AWS Identity
        run: aws sts get-caller-identity


      # -----------------------------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------------------------

      - name: Terraform Init

        id: init

        run: terraform init -no-color


      # -----------------------------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------------------------

      - name: Terraform Validate

        id: validate

        run: terraform validate -no-color


      # -----------------------------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------------------------

      - name: Terraform Plan

        id: plan

        run: |
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan

          terraform show \
            -no-color \
            tfplan > tfplan.txt

        continue-on-error: true


      # -----------------------------------------------------------------------
      # Publish Terraform plan to PR
      # -----------------------------------------------------------------------

      - name: Publish Plan to Pull Request

        if: always()

        uses: actions/github-script@v7

        env:
          PLAN_FILE: ${{ github.workspace }}/tfplan.txt

        with:

          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |

            const fs = require("fs");

            let planOutput = "";

            try {

              planOutput = fs.readFileSync(
                process.env.PLAN_FILE,
                "utf8"
              );

              if (planOutput.length > 60000) {


                planOutput =
                  planOutput.substring(0, 60000) +
                  "\n... [Output truncated. Check the workflow logs for the full plan.]";

              }

            } catch (error) {

              planOutput =
                "Terraform plan output could not be read.\n\n" +
                error.message;

            }


            const summary = [
              `**Init:** \`${{ steps.init.outcome }}\``,
              `**Validate:** \`${{ steps.validate.outcome }}\``,
              `**Plan:** \`${{ steps.plan.outcome }}\``
            ].join("  \n");


            const output = [
              "### 🚀 Terraform Plan",
              "",
              summary,
              "",
              "<details>",
              "<summary>📖 Show Terraform Diff / Plan</summary>",
              "",
              "```terraform",
              planOutput,
              "```",
              "",
              "</details>",
              "",
              `*Pushed by: @${{ github.actor }} | Event: \`${{ github.event_name }}\`*`
            ].join("\n");


            await github.rest.issues.createComment({

              owner: context.repo.owner,
              repo: context.repo.repo,

              issue_number: context.issue.number,

              body: output

            });


      # -----------------------------------------------------------------------
      # Fail if Terraform Plan failed
      # -----------------------------------------------------------------------

      - name: Fail if Plan Failed

        if: steps.plan.outcome == 'failure'

        run: exit 1



  # ===========================================================================
  # STAGE 3
  # INFRACOST
  # ===========================================================================

  infracost:

    name: "Infracost (Monthly Cost Diff)"

    needs:
      - terraform-plan

    if: >
      github.event_name == 'pull_request' &&
      needs.terraform-plan.outputs.infracost_enabled == 'true'

    runs-on: ubuntu-latest


    steps:

      # -----------------------------------------------------------------------
      # Checkout base branch: dev
      # -----------------------------------------------------------------------

      - name: Checkout Base Branch

        uses: actions/checkout@v4

        with:
          ref: ${{ github.event.pull_request.base.ref }}


      # -----------------------------------------------------------------------
      # Check whether dev contains Terraform
      # -----------------------------------------------------------------------

      - name: Check Base Terraform Configuration

        id: base_terraform

        run: |

          echo "Base branch:"
          echo "${{ github.event.pull_request.base.ref }}"

          echo
          echo "Terraform working directory:"
          echo "${{ env.TF_WORKING_DIR }}"

          if [ -f versions.tf ] && [ -f variables.tf ]; then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "Terraform root module exists on base branch."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo "::notice::No Terraform root module (versions.tf / variables.tf) on base branch."

          fi


      # -----------------------------------------------------------------------
      # Setup Infracost
      # -----------------------------------------------------------------------

      - name: Setup Infracost CLI

        uses: infracost/actions/setup@d51fc54d23c9ad90f984b884257bd96dc2625067 # v4.1.0

        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}


      # -----------------------------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false


      # -----------------------------------------------------------------------
      # AWS OIDC
      # -----------------------------------------------------------------------

      - name: Configure AWS Credentials (OIDC)

        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com


      # -----------------------------------------------------------------------
      # Verify AWS identity
      # -----------------------------------------------------------------------

      - name: Verify AWS Identity

        run: aws sts get-caller-identity


      # -----------------------------------------------------------------------
      # Terraform Init - base
      # -----------------------------------------------------------------------

      - name: Terraform Init (Base Branch)

        if: steps.base_terraform.outputs.exists == 'true'

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: terraform init -no-color


      # -----------------------------------------------------------------------
      # Infracost baseline
      # -----------------------------------------------------------------------

      - name: Generate Infracost Baseline

        if: steps.base_terraform.outputs.exists == 'true'

        env:
          TF_WORKING_DIR: ${{ env.TF_WORKING_DIR }}

        run: |

          USAGE_FILE="infracost-usage.yml"

          USAGE_ARGS=()

          if [ -f "$USAGE_FILE" ]; then
            USAGE_ARGS+=(--usage-file="$USAGE_FILE")
          fi

          infracost breakdown \
            --path="${TF_WORKING_DIR}" \
            --project-name=agrovesto-dev \
            "${USAGE_ARGS[@]}" \
            --format=json \
            --out-file=/tmp/infracost-base.json


      # -----------------------------------------------------------------------
      # Checkout PR branch
      # -----------------------------------------------------------------------

      - name: Checkout PR Branch

        uses: actions/checkout@v4


      # -----------------------------------------------------------------------
      # Verify PR Terraform configuration
      # -----------------------------------------------------------------------

      - name: Verify PR Terraform Configuration

        run: |

          if [ ! -f versions.tf ] || [ ! -f variables.tf ]; then

            echo "::error::No Terraform root module (versions.tf / variables.tf) on the PR branch."

            exit 1

          fi


      # -----------------------------------------------------------------------
      # Terraform Init - PR
      # -----------------------------------------------------------------------

      - name: Terraform Init (PR Branch)

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: terraform init -no-color


      # -----------------------------------------------------------------------
      # Infracost diff
      # -----------------------------------------------------------------------

      - name: Generate Infracost Diff

        id: infracost

        if: steps.base_terraform.outputs.exists == 'true'

        env:
          TF_WORKING_DIR: ${{ env.TF_WORKING_DIR }}

        run: |

          USAGE_FILE="infracost-usage.yml"

          USAGE_ARGS=()

          if [ -f "$USAGE_FILE" ]; then
            USAGE_ARGS+=(--usage-file="$USAGE_FILE")
          fi

          infracost diff \
            --path="${TF_WORKING_DIR}" \
            --project-name=agrovesto-dev \
            "${USAGE_ARGS[@]}" \
            --format=json \
            --compare-to=/tmp/infracost-base.json \
            --out-file=/tmp/infracost.json

        continue-on-error: true


      # -----------------------------------------------------------------------
      # Post Infracost comment
      # -----------------------------------------------------------------------

      - name: Post Infracost PR Comment

        if: always() && steps.infracost.outcome == 'success'

        run: |

          infracost comment github \
            --path=/tmp/infracost.json \
            --repo="${{ github.repository }}" \
            --github-token="${{ github.token }}" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --behavior=update


      # -----------------------------------------------------------------------
      # Inform when no baseline exists
      # -----------------------------------------------------------------------

      - name: Explain Infracost Skip

        if: steps.base_terraform.outputs.exists != 'true'

        run: |

          echo "::notice::Infracost baseline was skipped."
          echo "::notice::Branch '${{ github.event.pull_request.base.ref }}' has no Terraform root module (versions.tf / variables.tf)."
          echo "::notice::Once the Terraform stack exists on dev, future PRs will produce a cost diff."



  # ===========================================================================
  # STAGE 4
  # TERRAFORM APPLY
  # ===========================================================================

  terraform-apply:

    name: "Terraform Apply (Dev)"

    needs:
      - security-scan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4


      # -----------------------------------------------------------------------
      # Verify Terraform root module
      # -----------------------------------------------------------------------

      - name: Verify Terraform Root Module

        run: |

          echo "Terraform working directory (repo root):"
          pwd

          echo
          ls -la

          for file in ${{ env.TF_ROOT_FILES }} ${{ env.TF_TEMPLATES }}; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing '$file' in the Terraform root module."
              exit 1
            fi
          done

          echo
          echo "Terraform root module verified."


      # -----------------------------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:
          terraform_version: ${{ env.TF_VERSION }}


      # -----------------------------------------------------------------------
      # AWS OIDC
      # -----------------------------------------------------------------------

      - name: Configure AWS Credentials (OIDC)

        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com


      # -----------------------------------------------------------------------
      # Verify AWS identity
      # -----------------------------------------------------------------------

      - name: Verify AWS Identity

        run: aws sts get-caller-identity


      # -----------------------------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------------------------

      - name: Terraform Init

        run: terraform init -no-color


      # -----------------------------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------------------------

      - name: Terraform Validate

        run: terraform validate -no-color


      # -----------------------------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------------------------

      - name: Terraform Plan

        run: terraform plan \
          -no-color \
          -input=false


      # -----------------------------------------------------------------------
      # Terraform Apply
      # -----------------------------------------------------------------------

      - name: Terraform Apply

        run: terraform apply \
          -auto-approve \
          -input=false
