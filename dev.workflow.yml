# =============================================================================
#  Terraform CI/CD Pipeline  (Agrovesto / dev account)
#
#  This is a ROOT-LEVEL COPY of the intended GitHub Actions workflow.
#  The automation token used to manage this repo cannot push into
#  .github/workflows (no `workflows` permission), so keep this file in sync
#  here and install it locally with:
#
#      cp dev.workflow.yml .github/workflows/dev.yml
#
#  It adds an Infracost PR cost-estimate stage on top of the standard
#  checkov/trivy + plan/apply pipeline.
# =============================================================================
name: "Terraform CI/CD Pipeline"

# Notes:
# - All Terraform config for this account lives in environments/dev, so the
#   init / validate / plan / apply steps run with that working directory.
# - Templates (*.tftpl) and the scan configs (checkov.yml / trivy.yml) are
#   listed here so edits to them also trigger the pipeline.
# - Deploying the *dev* environment happens on a push to the `dev` branch.
#   (Plan/security checks also run on PRs and on push to `main`.)
on:
  pull_request:
    branches: [main, dev, devops]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftpl"
      - ".github/workflows/dev.yml"
      - "checkov.yml"
      - "trivy.yml"
  push:
    branches: [main, dev]
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.tftpl"
      - ".github/workflows/dev.yml"
      - "checkov.yml"
      - "trivy.yml"

# Only one run per ref at a time; supersede older queued runs on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write            # AWS OIDC authentication
  contents: read
  pull-requests: write       # Post Terraform plan + Infracost on PRs
  security-events: write     # Upload SARIF scan results

env:
  # The dev account's resources are created in eu-west-1 (see terraform.tfvars).
  # Region is also used by configure-aws-credentials for the OIDC STS call.
  AWS_REGION: "eu-west-1"
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  TF_VERSION: "1.6.6"
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: "environments/dev"
  TF_VAR_mssql_sa_password: ${{ secrets.TF_VAR_MSSQL_SA_PASSWORD }}
  # Optional: set the INFRACOST_API_KEY secret to enable the Infracost job.
  # If it is not defined this evaluates to an empty string and the job is skipped.
  INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

jobs:
  # ==============================================================
  # STAGE 1: LINT & SECURITY SCAN (CHECKOV + TRIVY)
  # No AWS credentials needed. Scans run from the repo root so the
  # committed checkov.yml / trivy.yml (with the dev skip-list) are used.
  # ==============================================================
  security-scan:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Informational (non-blocking) formatting check. Kept non-fatal because
      # several files still need a `terraform fmt` pass; flip to fatal once the
      # tree is formatted and add a `terraform fmt -check` gate in the plan job.
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      # Config is taken from checkov.yml at the repo root (auto-discovered),
      # which carries the intentional DEV skip-list.
      - name: Checkov IaC Scan
        id: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0 (pinned SHA)
        with:
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: checkov-iac-scan

      # Single Trivy run producing SARIF (replaces the previous two runs that
      # scanned twice). Findings surface in GitHub code scanning.
      - name: Trivy Misconfiguration Scan
        id: trivy
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned SHA)
        with:
          scan-type: config
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac-scan

  # ==============================================================
  # STAGE 2: TERRAFORM PLAN & PR DIFF COMMENT (PULL REQUESTS)
  # ==============================================================
  terraform-plan:
    name: Terraform Plan & Diff
    needs: security-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init -no-color

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            && terraform show -no-color tfplan > tfplan.txt
        continue-on-error: true

      - name: Publish Plan to Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = "";
            try {
              planOutput = fs.readFileSync('tfplan.txt', 'utf8');
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) +
                  "\n... [Output Truncated - Check Job Log for Full Diff]";
              }
            } catch (err) {
              planOutput = "Error reading plan file.";
            }

            const summary = [
              "**Init:** `${{ steps.init.outcome }}`",
              "**Validate:** `${{ steps.validate.outcome }}`",
              "**Plan:** `${{ steps.plan.outcome }}`"
            ].join("  \n");

            const output = `### 🚀 Terraform Plan
            \n${summary}
            \n<details><summary>📖 Show Terraform Diff / Plan</summary>
            \n\`\`\`terraform
            \n${planOutput}
            \n\`\`\`
            \n</details>
            \n*Pushed by: @${{ github.actor }} | Event: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ==============================================================
  # STAGE 3 (PR ONLY): INFRACOST COST ESTIMATE
  # Posts a "monthly cost change" comment that compares the base branch
  # against the PR. Runs only when the INFRACOST_API_KEY secret is set.
  # ==============================================================
  infracost:
    name: Infracost (monthly cost diff)
    needs: terraform-plan
    if: github.event_name == 'pull_request' && env.INFRACOST_API_KEY != ''
    runs-on: ubuntu-latest
    env:
      TF_ROOT: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --- baseline: current state on the base (target) branch ---
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Infracost CLI
        uses: infracost/actions/setup@d51fc54d23c9ad90f984b884257bd96dc2625067 # v4.1.0 (pinned SHA)
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}

      - name: Generate Infracost cost-estimate baseline
        run: |
          infracost breakdown --path="${{ env.TF_ROOT }}" \
                              --project-name=agrovesto-dev \
                              --format=json \
                              --out-file=/tmp/infracost-base.json
        env:
          INFRACOST_API_KEY: ${{ env.INFRACOST_API_KEY }}

      # --- current: PR branch so Infracost can diff against the baseline ---
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Generate Infracost diff
        id: infracost
        run: |
          infracost diff --path="${{ env.TF_ROOT }}" \
                         --project-name=agrovesto-dev \
                         --format=json \
                         --compare-to=/tmp/infracost-base.json \
                         --out-file=/tmp/infracost.json
        continue-on-error: true
        env:
          INFRACOST_API_KEY: ${{ env.INFRACOST_API_KEY }}

      # Posts a single comment and updates it on subsequent pushes.
      - name: Post Infracost PR comment
        if: always()
        run: |
          infracost comment github --path=/tmp/infracost.json \
                                   --repo="${{ github.repository }}" \
                                   --github-token="${{ github.token }}" \
                                   --pull-request="${{ github.event.pull_request.number }}" \
                                   --behavior=update
        env:
          INFRACOST_API_KEY: ${{ env.INFRACOST_API_KEY }}

  # ==============================================================
  # STAGE 4: TERRAFORM APPLY (PUSH TO DEV)
  # ==============================================================
  terraform-apply:
    name: Terraform Apply (dev)
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
