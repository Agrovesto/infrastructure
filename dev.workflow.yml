# =============================================================================
# Terraform CI/CD Pipeline
# Agrovesto / Dev Account.
#
# LAYOUT: the repo now holds one folder per environment — dev/ (dev stack)
# and prod/ (prod stack) — each a self-contained flat Terraform root module.
# This workflow only touches dev/ (TF_WORKING_DIR = "dev"); the prod pipeline
# is prod.workflow.yml.
#
# STAGES: 1 security-scan (fmt, Checkov, Trivy) -> 2 terraform-test (terraform
# test + resource coverage, gated on TF_COVERAGE_FAIL_UNDER) -> 3
# sonarqube-scan -> 4 terraform-plan (PR comment) -> 5 terraform-apply.
# Stages 2 and 3 gate 4 and 5.
#
# INSTALL: this file is the canonical copy of the pipeline. Merging it does
# NOT change what GitHub Actions runs -- the copy below has to be made by hand:
#
#     cp dev.workflow.yml .github/workflows/dev.yml
#     git add .github/workflows/dev.yml && git commit -m "ci: install pipeline" && git push
#
# The automation token that manages this repo has no `workflows` permission, so
# neither it nor an agent can commit into .github/workflows: a push touching
# those paths is rejected with "refusing to allow a GitHub App to create or
# update workflow ... without `workflows` permission". Until the copy is made
# the installed .github/workflows/dev.yml keeps running the previous pipeline
# and keeps failing at Terraform Init.
# =============================================================================

name: "Terraform CI/CD Pipeline"

# =============================================================================
# TRIGGERS
# =============================================================================

on:

  # ---------------------------------------------------------------------------
  # Pull Requests into dev
  # ---------------------------------------------------------------------------
  pull_request:
    branches:
      - dev

    paths:
      - "dev/**"
      - "dev.workflow.yml"

  # ---------------------------------------------------------------------------
  # Pushes to dev
  # ---------------------------------------------------------------------------
  push:
    branches:
      - dev

    paths:
      - "dev/**"
      - "dev.workflow.yml"

# =============================================================================
# CONCURRENCY
# =============================================================================

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# GITHUB TOKEN PERMISSIONS
# =============================================================================

permissions:
  contents: read
  id-token: write
  pull-requests: write

# =============================================================================
# GLOBAL ENVIRONMENT
# =============================================================================

env:

  # AWS
  AWS_REGION: "eu-west-1"
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN_DEV }}

  # Terraform
  #
  # MUST satisfy `required_version` in both `dev/versions.tf` and
  # `prod/versions.tf`, which pin ">= 1.7.0" for `mock_provider` /
  # `override_data` in `terraform test`. Terraform checks that constraint in
  # `init`, before it does anything else, so a lower pin here fails the whole
  # pipeline at "Terraform Init" with:
  #
  #     Error: Unsupported Terraform Core version
  #
  # Bump both together. (This was pinned to 1.6.6 while the modules asked for
  # >= 1.7.0, which is exactly how that failure happened.)
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"

  # Minimum Terraform resource coverage, in percent, enforced by
  # scripts/tf_coverage.py. Set to a ratchet just under today's measured
  # value so the number can only go up; see tests/README.md.
  TF_COVERAGE_FAIL_UNDER: "60"

  # The dev stack now lives in ./dev (prod stack in ./prod).
  TF_WORKING_DIR: "dev"

  # Files that must exist for this to be a valid Terraform root module.
  TF_ROOT_FILES: "versions.tf variables.tf locals.tf outputs.tf"
  TF_TEMPLATES: "user_data.sh.tftpl docker-compose.yml.tftpl nginx.conf.tftpl"

  # MSSQL
  TF_VAR_mssql_sa_password: ${{ secrets.TF_VAR_MSSQL_SA_PASSWORD_DEV }}

# =============================================================================
# JOBS
# =============================================================================

jobs:

  # ===========================================================================
  # STAGE 1
  # LINT + SECURITY SCAN
  # ===========================================================================

  security-scan:

    name: "Lint & Security Scan"

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Terraform
      # -----------------------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------------------------------------------------
      # Terraform formatting
      # -----------------------------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Checkov
      # -----------------------------------------------------------------------

      - name: Checkov IaC Scan
        id: checkov

        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0

        with:
          directory: ${{ env.TF_WORKING_DIR }}
          config_file: dev/checkov.yml
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      # -----------------------------------------------------------------------
      # Store Checkov SARIF
      # -----------------------------------------------------------------------

      - name: Store Checkov Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: checkov-sarif
          path: results.sarif
          retention-days: 14
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # Trivy — vulnerabilities + secrets + misconfiguration
      # -----------------------------------------------------------------------

      - name: Trivy Scan (vuln + secret + misconfig)
        id: trivy

        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0

        with:
          scan-type: fs
          scan-ref: dev
          trivy-config: dev/trivy.yml
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: "1"

        continue-on-error: true

      # -----------------------------------------------------------------------
      # Store Trivy Report
      # -----------------------------------------------------------------------

      - name: Store Trivy Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 14
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # Scan summary (git metadata + Checkov + Trivy) -> GitHub job summary
      # -----------------------------------------------------------------------

      - name: Build Scan Summary
        if: always()

        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        run: |
          {
            echo "## Scan Summary"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Repository | `${{ github.repository }}` |"
            echo "| Branch / ref | `${{ github.ref_name }}` (`${{ github.ref }}`) |"
            echo "| Commit | `${{ github.sha }}` |"
            echo "| Trigger | `${{ github.event_name }}` by @${{ github.actor }} |"
            echo "| Run | [#${{ github.run_number }} of `${{ github.workflow }}`]($RUN_URL) |"
            echo "| Terraform dir | `${{ env.TF_WORKING_DIR }}` |"
            echo "| Checkov step | `${{ steps.checkov.outcome }}` |"
            echo "| Trivy step | `${{ steps.trivy.outcome }}` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PYEOF'
          import collections
          import json
          import os
          import pathlib

          out = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = []

          # ---- Checkov (parsed from the SARIF report) -----------------------
          sarif = pathlib.Path("results.sarif")
          if sarif.exists() and sarif.stat().st_size:
              try:
                  results = json.loads(sarif.read_text())["runs"][0].get("results", [])
              except Exception as exc:
                  results = None
                  lines.append("### Checkov")
                  lines.append("")
                  lines.append("could not parse results.sarif: %s" % exc)
                  lines.append("")
              if results is not None:
                  lines.append("### Checkov")
                  lines.append("")
                  if not results:
                      lines.append("PASS: no failed checks")
                      lines.append("")
                  else:
                      by_level = collections.Counter(r.get("level", "error") for r in results)
                      by_rule = collections.Counter(r["ruleId"] for r in results)
                      lines.append("FAIL: %d findings (errors %d, warnings %d, notes %d)" % (
                          len(results),
                          by_level.get("error", 0),
                          by_level.get("warning", 0),
                          by_level.get("note", 0),
                      ))
                      lines.append("")
                      lines.append("| Rule | Findings |")
                      lines.append("| --- | --- |")
                      for rule, count in by_rule.most_common(15):
                          lines.append("| `%s` | %d |" % (rule, count))
                      lines.append("")
          else:
              lines.append("### Checkov")
              lines.append("")
              lines.append("PASS: no SARIF report produced (no findings)")
              lines.append("")

          # ---- Trivy ----------------------------------------------------------
          trivy = pathlib.Path("trivy-report.txt")
          lines.append("### Trivy (Vulnerabilities, Secrets & Misconfigurations)")
          lines.append("")
          if trivy.exists() and trivy.stat().st_size > 0:
              report_text = trivy.read_text(errors="replace")
              if "CRITICAL" in report_text or "HIGH" in report_text:
                  crit = report_text.count("CRITICAL")
                  high = report_text.count("HIGH")
                  lines.append("⚠️ **FAIL:** Findings detected (%d CRITICAL, %d HIGH)" % (crit, high))
              else:
                  lines.append("✅ **PASS:** Scan completed cleanly with no HIGH/CRITICAL findings.")
              lines.append("")
              lines.append("<details open><summary>📋 Full Trivy Scan Report</summary>")
              lines.append("")
              lines.append("```text")
              lines.append(report_text[:30000])
              lines.append("```")
              lines.append("</details>")
              lines.append("")
          else:
              lines.append("✅ **PASS:** No HIGH or CRITICAL findings detected by Trivy.")
              lines.append("")

          with out.open("a") as fh:
              fh.write("\n".join(lines) + "\n")
          PYEOF

  # ===========================================================================
  # STAGE 2
  # TERRAFORM TEST + COVERAGE
  # ===========================================================================

  terraform-test:

    name: "Terraform Test & Coverage"

    needs:
      - security-scan

    runs-on: ubuntu-latest

    # The suites are offline -- `mock_provider "aws"` means no AWS calls and no
    # state -- so this job needs no OIDC credentials. `-backend=false` keeps the
    # S3 backend out of `init`; the real AWS provider schema still has to be
    # downloaded once, because the mock provider reuses it.
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------------------------------------------------
      # Terraform Init -- providers only, never the state backend
      # -----------------------------------------------------------------------

      - name: Terraform Init (backend=false)

        run: terraform init -backend=false -input=false -no-color

      # -----------------------------------------------------------------------
      # Terraform test
      #
      # -json so the coverage step can read the same run. continue-on-error
      # keeps the job going when the suite fails, so the report below still
      # explains what broke; the coverage step is what actually fails the job.
      # -----------------------------------------------------------------------

      - name: Terraform Test

        id: test

        continue-on-error: true

        run: |
          set -o pipefail
          terraform test -no-color -json 2>test-stderr.log | tee test-results.json
          echo
          echo "--- terraform test stderr ---"
          cat test-stderr.log

      # -----------------------------------------------------------------------
      # Resource coverage + verdict
      #
      # Fails the job if the suite failed OR coverage is under
      # TF_COVERAGE_FAIL_UNDER. Runs from the repo root so the script sees the
      # module as `prod` / `dev` rather than `.`.
      # -----------------------------------------------------------------------

      - name: Compute Test Coverage

        working-directory: ${{ github.workspace }}

        run: |
          python3 scripts/tf_coverage.py "${{ env.TF_WORKING_DIR }}" \
            --test-json "${{ env.TF_WORKING_DIR }}/test-results.json" \
            --fail-under "${{ env.TF_COVERAGE_FAIL_UNDER }}" \
            --json "${{ env.TF_WORKING_DIR }}/coverage.json" \
            --summary-md coverage.md

          {
            echo ''
            cat coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # Keep the raw reports
      # -----------------------------------------------------------------------

      - name: Upload Test + Coverage Report

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: ${{ env.TF_WORKING_DIR }}-terraform-test
          path: |
            ${{ env.TF_WORKING_DIR }}/test-results.json
            ${{ env.TF_WORKING_DIR }}/test-stderr.log
            ${{ env.TF_WORKING_DIR }}/coverage.json
            coverage.md
          retention-days: 14
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 3
  # SONARQUBE ANALYSIS
  # ===========================================================================

  sonarqube-scan:

    name: "SonarQube Analysis (Dev)"

    needs:
      - security-scan

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:
          # Full history: SonarQube wants blame data for new-code analysis.
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Credentials gate
      #
      # SonarQube is opt-in so an unconfigured repository is never blocked.
      # Set these secrets to switch it on:
      #
      #   SONAR_TOKEN     required. Generate in SonarQube under
      #                   My Account > Security, or in SonarCloud under
      #                   Administration > Security > Global Analysis Tokens.
      #                   Needs the "Execute Analysis" permission.
      #
      #   SONAR_HOST_URL  required for a self-hosted SonarQube Server, e.g.
      #                   https://sonar.example.com. Leave unset to target
      #                   SonarCloud (https://sonarcloud.io).
      #
      # The project key and file scope come from sonar-project-dev.properties, so dev and
      # prod report as two separate SonarQube projects.
      # -----------------------------------------------------------------------

      - name: Check SonarQube Credentials

        id: sonar

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not set; skipping the SonarQube scan. The SonarQube Summary step records the skip in the job summary."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Scan
      # -----------------------------------------------------------------------

      - name: SonarQube Scan

        if: steps.sonar.outputs.configured == 'true'

        continue-on-error: true

        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5.3.0

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        with:
          projectBaseDir: .
          args: -Dproject.settings=sonar-project-dev.properties -Dsonar.defaultBranch=devops

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------

      - name: SonarQube Summary

        if: always()

        env:
          # Values are passed via env rather than interpolated into the shell,
          # and the backticks below are escaped so markdown code spans survive.
          OUTCOME: ${{ steps.sonar.outputs.configured == 'true' && 'scanned' || 'skipped' }}
          CREDENTIALS: ${{ steps.sonar.outputs.configured == 'true' && 'present' || 'absent' }}

        run: |
          {
            # Blank line first: a heading glued to the previous section's last
            # line is not parsed as a heading by the markdown renderer.
            echo ''
            echo '## SonarQube (Dev)'
            echo ''
            echo '| | |'
            echo '| --- | --- |'
            echo "| Outcome | \`$OUTCOME\` |"
            echo "| Credentials | \`$CREDENTIALS\` |"
            echo '| Config file | `sonar-project-dev.properties` |'
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # STAGE 4
  # TERRAFORM PLAN
  # ===========================================================================

  terraform-plan:

    name: "Terraform Plan & PR Diff"

    needs:
      - security-scan
      - terraform-test
      - sonarqube-scan

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout PR merge ref
      # -----------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Verify Terraform root module
      # -----------------------------------------------------------------------

      - name: Verify Terraform Root Module
        run: |

          echo "Workspace:"
          pwd

          echo
          echo "Terraform working directory:"
          echo "${{ env.TF_WORKING_DIR }}"

          echo
          echo "Repository contents:"
          ls -la

          for file in ${{ env.TF_ROOT_FILES }} ${{ env.TF_TEMPLATES }}; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing '$file' in the Terraform root module."
              exit 1
            fi
          done

          echo
          echo "Terraform root module verified."

          if [ -f terraform.auto.tfvars ]; then
            echo
            echo "terraform.auto.tfvars is present (auto-loaded by terraform)."
          else
            echo
            echo "::warning::No terraform.auto.tfvars found; required variables must come from TF_VAR_* env vars."
          fi

      # -----------------------------------------------------------------------
      # Terraform
      # -----------------------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------------------------------------------------
      # AWS OIDC authentication
      # -----------------------------------------------------------------------

      - name: Configure AWS Credentials (OIDC)

        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # -----------------------------------------------------------------------
      # Verify AWS identity
      # -----------------------------------------------------------------------

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # -----------------------------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------------------------

      - name: Terraform Init

        id: init

        run: terraform init -no-color

      # -----------------------------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------------------------

      - name: Terraform Validate

        id: validate

        run: terraform validate -no-color

      # -----------------------------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------------------------

      - name: Terraform Plan

        id: plan

        run: |
          terraform plan \
            -no-color \
            -input=false \
            -out=tfplan

          terraform show \
            -no-color \
            tfplan > tfplan.txt

        continue-on-error: true

      # -----------------------------------------------------------------------
      # Publish Terraform plan to PR
      # -----------------------------------------------------------------------

      - name: Publish Plan to Pull Request

        if: always()

        uses: actions/github-script@v7

        env:
          PLAN_FILE: ${{ github.workspace }}/${{ env.TF_WORKING_DIR }}/tfplan.txt

        with:

          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |

            const fs = require("fs");

            let planOutput = "";

            try {

              planOutput = fs.readFileSync(
                process.env.PLAN_FILE,
                "utf8"
              );

              if (planOutput.length > 60000) {


                planOutput =
                  planOutput.substring(0, 60000) +
                  "\n... [Output truncated. Check the workflow logs for the full plan.]";

              }

            } catch (error) {

              planOutput =
                "Terraform plan output could not be read.\n\n" +
                error.message;

            }


            const summary = [
              `**Init:** \`${{ steps.init.outcome }}\``,
              `**Validate:** \`${{ steps.validate.outcome }}\``,
              `**Plan:** \`${{ steps.plan.outcome }}\``
            ].join("  \n");


            const output = [
              "### 🚀 Terraform Plan",
              "",
              summary,
              "",
              "<details>",
              "<summary>📖 Show Terraform Diff / Plan</summary>",
              "",
              "```terraform",
              planOutput,
              "```",
              "",
              "</details>",
              "",
              `*Pushed by: @${{ github.actor }} | Event: \`${{ github.event_name }}\`*`
            ].join("\n");


            await github.rest.issues.createComment({

              owner: context.repo.owner,
              repo: context.repo.repo,

              issue_number: context.issue.number,

              body: output

            });

      # -----------------------------------------------------------------------
      # Fail if Terraform Plan failed
      # -----------------------------------------------------------------------

      - name: Fail if Plan Failed

        if: steps.plan.outcome == 'failure'

        run: exit 1

  # ===========================================================================
  # STAGE 5
  # TERRAFORM APPLY
  # ===========================================================================

  terraform-apply:

    name: "Terraform Apply (Dev)"

    needs:
      - security-scan
      - terraform-test
      - sonarqube-scan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Checkout Repository

        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Verify Terraform root module
      # -----------------------------------------------------------------------

      - name: Verify Terraform Root Module

        run: |

          echo "Terraform working directory (repo root):"
          pwd

          echo
          ls -la

          for file in ${{ env.TF_ROOT_FILES }} ${{ env.TF_TEMPLATES }}; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing '$file' in the Terraform root module."
              exit 1
            fi
          done

          echo
          echo "Terraform root module verified."

      # -----------------------------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -----------------------------------------------------------------------
      # AWS OIDC
      # -----------------------------------------------------------------------

      - name: Configure AWS Credentials (OIDC)

        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # -----------------------------------------------------------------------
      # Verify AWS identity
      # -----------------------------------------------------------------------

      - name: Verify AWS Identity

        run: aws sts get-caller-identity

      # -----------------------------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------------------------

      - name: Terraform Init

        run: terraform init -no-color

      # -----------------------------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------------------------

      - name: Terraform Validate

        run: terraform validate -no-color

      # -----------------------------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------------------------

      - name: Terraform Plan

        run: terraform plan \
          -no-color \
          -input=false

      # -----------------------------------------------------------------------
      # Terraform Apply
      # -----------------------------------------------------------------------

      - name: Terraform Apply

        run: terraform apply \
          -auto-approve \
          -input=false
