# Infracost usage file for the `prod` stack (flat root module).
#
# Use with:  infracost breakdown --path=prod --usage-file=prod/infracost-usage.yml
# (or just rely on the root infracost.yml, which wires both projects up)
#
# Usage values *supplement* the static Terraform config. Only consumption-based
# figures that Infracost cannot infer belong here. Key names follow the
# upstream schema:
# https://github.com/infracost/infracost/blob/master/infracost-usage-example.yml
version: 0.3
resource_usage:
  # ---- Application Load Balancer -------------------------------------------
  # Fixed hourly cost comes from the config; LCU usage is traffic-driven.
  # Rough starting estimate for the five low-traffic APIs; tune with real
  # CloudWatch numbers.
  aws_lb.main:
    new_connections: 5      # avg new connections per second
    active_connections: 100 # avg active connections per minute
    processed_bytes: 100    # GB processed per month
    rule_evaluations: 200   # avg rule evaluations per second

  # ---- NAT gateways (one per AZ in prod) -------------------------------------
  # aws_nat_gateway.main[0]:
  #   monthly_data_processed_gb: 50   # ECR pulls + CloudWatch + Secrets Manager
  # aws_nat_gateway.main[1]:
  #   monthly_data_processed_gb: 50

  # ---- Fargate services -------------------------------------------------------
  # Infracost assumes 730 running hours/month per task; override per service
  # if you scale down at night, e.g.:
  # aws_ecs_service.services["wallet"]:
  #   hours: 730
