# Reference stack matching modules/dev_host/runtime.tf for 5 APIs.
# On the real EC2 host Terraform renders the live file to /opt/agrovesto/compose.yaml.
# Secrets never live here — env_file paths are populated at runtime.

name: agrovesto-dev

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    container_name: nomaos-dev-mssql
    restart: unless-stopped
    user: "10001:0"
    mem_limit: 5g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "4096"
    env_file:
      - path: ./env/sql.env
        required: true
    volumes:
      - mssql-data:/var/opt/mssql
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 90s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -N -C -b -Q 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  onboarding:
    image: ${ONBOARDING_IMAGE:-agrovesto/onboarding:local}
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    ports: ["8080:8080"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    mem_limit: 512m
    env_file:
      - path: ./env/onboarding.env
        required: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  wallet:
    image: ${WALLET_IMAGE:-agrovesto/wallet:local}
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    ports: ["8081:8080"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    mem_limit: 512m
    env_file:
      - path: ./env/wallet.env
        required: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  input:
    image: ${INPUT_IMAGE:-agrovesto/input:local}
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    ports: ["8082:8080"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    mem_limit: 512m
    env_file:
      - path: ./env/input.env
        required: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  serviceprovider:
    image: ${SERVICEPROVIDER_IMAGE:-agrovesto/serviceprovider:local}
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    ports: ["8083:8080"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    mem_limit: 512m
    env_file:
      - path: ./env/serviceprovider.env
        required: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  moneval:
    image: ${MONEVAL_IMAGE:-agrovesto/moneval:local}
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    ports: ["8084:8080"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    mem_limit: 512m
    env_file:
      - path: ./env/moneval.env
        required: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  mssql-data:
